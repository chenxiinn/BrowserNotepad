<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>打开备忘录</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 220px; padding: 16px; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: #1a1a2e; color: #e2e8f0; }
    .logo { text-align: center; margin-bottom: 12px; }
    .logo svg { width: 32px; height: 32px; }
    .logo h3 { font-size: 13px; font-weight: 600; margin-top: 6px; font-family: 'JetBrains Mono', monospace; color: #d97706; }
    .btn {
      width: 100%; padding: 10px 12px; margin-bottom: 8px; border: 1px solid #2a3a5c;
      border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600;
      transition: all 120ms ease; display: flex; align-items: center; justify-content: center; gap: 6px;
      font-family: 'Inter', -apple-system, sans-serif;
    }
    .btn-sidebar { background: #d97706; color: #fff; border-color: #d97706; }
    .btn-sidebar:hover { background: #f59e0b; }
    .btn-floating { background: transparent; color: #94a3b8; }
    .btn-floating:hover { background: #1e2d4a; color: #e2e8f0; border-color: #d97706; }
    .desc { font-size: 11px; color: #64748b; margin-top: 8px; text-align: center; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="logo">
    <svg viewBox="0 0 64 64" width="32" height="32">
      <rect x="4" y="4" width="56" height="56" rx="12" fill="#1a1a2e" stroke="#d97706" stroke-width="3"/>
      <line x1="18" y1="22" x2="46" y2="22" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="18" y1="32" x2="38" y2="32" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
      <line x1="18" y1="42" x2="42" y2="42" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
      <circle cx="14" cy="22" r="2" fill="#d97706"/>
      <circle cx="14" cy="32" r="1.5" fill="#94a3b8"/>
      <circle cx="14" cy="42" r="1.5" fill="#94a3b8"/>
    </svg>
    <h3>备忘录</h3>
  </div>
  <button class="btn btn-sidebar" id="btnSidebar">
    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
    在侧边栏打开
  </button>
  <button class="btn btn-floating" id="btnFloating">
    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
    悬浮窗打开
  </button>
  <p class="desc">侧边栏：固定在浏览器右侧<br>悬浮窗：独立弹窗，可拖动调整</p>
  <script src="popup.js"></script>
</body>
</html>
